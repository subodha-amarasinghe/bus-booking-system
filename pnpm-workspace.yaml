packages:
  - 'apps/*'
  - 'libs/*'
autoInstallPeers: true
allowBuilds:
  nx: true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  less: true
  prisma: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - less
  - nx
  - prisma
  - unrs-resolver
overrides:
  typescript: 5.8.3
  react: 18.3.1
  react-dom: 18.3.1
  supports-color: 8.1.1
  sass: 1.102.0
  babel-plugin-macros: 3.1.0
peerDependencyRules:
  ignoreMissing:
    - '@babel/plugin-proposal-*'
  allowedVersions:
    react: '18'
    react-dom: '18'
    next: '14'
